name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build, Lint, Test & Dist Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run test suite
        run: pnpm test

      - name: Build and bundle action
        run: pnpm build

      - name: Verify dist/action.cjs consistency
        run: |
          git status --porcelain dist/action.cjs
          if [ -n "$(git status --porcelain dist/action.cjs)" ]; then
            echo "::error::dist/action.cjs is out of sync with src/. Run 'pnpm build' and commit the result."
            git diff dist/action.cjs
            exit 1
          fi

      - name: Self-dogfooding CLI Check
        run: node bin/dripguard.js check --mock

      - name: Dogfood GitHub Action locally
        uses: ./
        with:
          provider: 'mock'
          comment: 'false'
          summary: 'true'
